# Supabase 無料プランは7日間アクセスがないと一時停止するため、3日おきに公開側を叩く。
# リポジトリの Settings → Secrets and variables → Actions → Variables に SITE_URL を登録すると動く。
name: keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SITE_URL != '' }}
    steps:
      - name: Ping health endpoint
        run: curl --fail --silent --show-error --max-time 30 "${{ vars.SITE_URL }}/api/health"
